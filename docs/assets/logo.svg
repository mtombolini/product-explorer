  <g fill="#FFDB00">
    <rect x="18" y="18" width="25.5" height="25.5" rx="6" />
    <rect x="52.5" y="18" width="25.5" height="25.5" rx="6" />
    <rect x="18" y="52.5" width="25.5" height="25.5" rx="6" />
  </g>
  <circle cx="63.6" cy="63.6" r="10.2" fill="none" stroke="#FFDB00" stroke-width="7.2" />
