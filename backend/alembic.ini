# Alembic configuration. The database URL is not set here: migrations/env.py
# takes it from the application settings (DATABASE_URL). Logging is not set
# here either: env.py uses the JSON logging of the application.

[alembic]
script_location = migrations
# Makes the "app" package importable from migrations/env.py.
prepend_sys_path = .
path_separator = os
