# Security headers of every response. Included at server level and again
# in each location that declares its own add_header: Nginx drops the
# add_header directives of the outer level as soon as a location declares
# one. "always" also sends them with error responses.
#
# Strict-Transport-Security is not here: Nginx speaks plain HTTP behind
# the TLS terminator of the platform, which adds it (see
# docker-compose.prod.yml).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Only this origin, with one exception: style-src allows 'unsafe-inline'
# because MUI styles with Emotion, which injects <style> tags at run time.
# Images allow data: for small inlined images; the font is self-hosted
# with @fontsource, so it comes from /assets/ too.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
