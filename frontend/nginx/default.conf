# Nginx for the Product Explorer frontend: serves the static build and
# proxies /api/ and /images/ to the backend, so the browser only ever talks
# to one origin and CORS is not needed.

# Docker's embedded DNS server. Together with the variable used in
# proxy_pass below, it makes Nginx look up "backend" while handling requests
# instead of once at startup. A rebuilt backend container gets a new IP
# address, and Nginx picks it up within 10 seconds without a restart.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the Nginx version.
    server_tokens off;

    # Basic security headers, sent with every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # By default a location that declares its own add_header drops the ones
    # declared here. "merge" keeps both sets.
    add_header_inherit merge;

    # Compress text responses. HTML is always included by Nginx.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # Also compress what comes back from the backend (JSON).
    gzip_proxied any;
    gzip_types text/css application/javascript application/json
               image/svg+xml;

    # A variable in proxy_pass is what forces the DNS lookup at request
    # time. With no path after the port, the original URI is passed as is.
    set $backend http://backend:8000;

    # Headers sent to the backend on every proxied request. $request_id is
    # generated by Nginx for each request; the backend reuses it so that
    # the log lines of both containers can be matched.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        proxy_pass $backend;
    }

    location /images/ {
        proxy_pass $backend;
    }

    # Build output with a content hash in the file name: a new build
    # produces new names, so these files can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # A missing asset is a real 404, not the application shell.
        try_files $uri =404;
    }

    # The entry document must be revalidated on every visit, otherwise a
    # browser could keep an old index.html that points to old assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page application fallback: any path that is not a file is
    # answered with index.html and the client-side router takes over.
    location / {
        try_files $uri /index.html;
    }
}
